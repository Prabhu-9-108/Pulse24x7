name: Pulse24×7 Auto-Scraper & GitHub Pages Deploy

on:

Runs automatically every 6 hours (00:30, 06:30, 12:30, 18:30 UTC)

schedule:
- cron: '30 */6 * * *'

Allows 1-click manual trigger from the GitHub Actions tab

workflow_dispatch:

Also runs when code is pushed to main branch

push:
branches:
- main

permissions:
contents: write
pages: write
id-token: write

jobs:
scrape-and-publish:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4

  - name: Set up Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Run Pulse24×7 Autonomous News & Jobs Scraper
    env:
      # Optional: Add GEMINI_API_KEY in Repo Settings -> Secrets -> Actions
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    run: |
      python auto_scraper.py

  - name: Commit & Push Updated feeds.json and sitemap.xml
    run: |
      git config --global user.name "Pulse24x7 AutoPilot Bot"
      git config --global user.email "actions@github.com"
      git add feeds.json sitemap.xml
      git diff --staged --quiet || (git commit -m "chore(pulse24x7-sync): update daily current affairs & jobs feed [skip ci]" && git push)
